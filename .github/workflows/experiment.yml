name: Controlled experiment
on:
  workflow_dispatch:
    inputs:
      config:
        description: Experiment size
        type: choice
        options: [pilot, full]
        default: pilot
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Train and evaluate
        env:
          SIZE: ${{ inputs.config }}
        run: uv run newsvendor experiment --config "configs/$SIZE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experiment-${{ inputs.config }}
          path: results/
          retention-days: 14
