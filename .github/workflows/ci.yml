name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts/run_research.py scripts/train_demand.py
      - run: uv run ruff format --check src tests scripts/run_research.py scripts/train_demand.py
      - run: uv run pytest -q
      - name: Restore and audit the pinned evaluation snapshot
        run: uv run newsvendor restore-eval
      - name: Check research inputs and source-family separation
        run: >-
          uv run python scripts/run_research.py
          --config configs/research-from-scratch.json
          --stage check --output results/ci-research-check
      - run: uv run newsvendor smoke --config configs/full.json
